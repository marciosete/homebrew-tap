# Keeps the cask at Maggie's latest release. It runs every hour and on demand,
# with this repository's own token, so the release pipeline over in
# marciosete/maggie needs no access here.

name: Bump

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo marciosete/maggie --json tagName -q .tagName)
          version="${tag#v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/maggie.rb)
          if [ "$version" = "$current" ]; then
            echo "cask is at $version"
            exit 0
          fi
          url="https://github.com/marciosete/maggie/releases/download/$tag/Maggie.dmg"
          sha=$(curl -sSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s/^  version \".*\"$/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
            Casks/maggie.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "maggie $version"
          git push
